<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>易个日历 · 万年历</title>
<meta name="description" content="简洁的万年历：公历、农历、节气、节日与法定节假日，支持添加到手机主屏幕，离线可用。">

<!-- PWA：可安装到桌面 / 主屏幕 -->
<meta name="theme-color" content="#f5f5f7">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="易个日历">
<meta name="application-name" content="易个日历">

<link rel="preload" href="assets/js/lunar.js" as="script">
<link rel="stylesheet" href="assets/css/app.css">
<style>
/* 独立窗口（添加到主屏幕）下让内容避开状态栏 */
@media (display-mode: standalone) {
  @supports (padding: env(safe-area-inset-top)) {
    body { padding-top: calc(14px + env(safe-area-inset-top)); }
  }
}
</style>
</head>
<body>

<div class="calendar">
  <div class="top">
    <span class="app-name">📅 万年历</span>
  </div>

  <div class="header">
    <button class="nav-btn" id="prevBtn" type="button" aria-label="上个月">‹</button>
    <div class="title-area">
      <div id="monthTitle"></div>
      <span id="lunarYearText"></span>
      <button class="today-btn" id="todayBtn" type="button">今天</button>
    </div>
    <button class="nav-btn" id="nextBtn" type="button" aria-label="下个月">›</button>
  </div>

  <div class="weekdays">
    <div class="we">日</div><div>一</div><div>二</div><div>三</div>
    <div>四</div><div>五</div><div class="we">六</div>
  </div>

  <div class="days" id="days"></div>

  <div class="panel" id="panel"></div>
</div>
<div class="author-links" aria-label="作者社交链接">
<a class="author-link" href="https://v.kuaishou.com/K2EpVuaY" target="_blank" rel="noopener noreferrer" aria-label="关于作者：泓，打开快手主页">
  <span class="kuaishou-icon" aria-hidden="true"><img src="assets/images/image-1.png" alt=""></span>
  <span>关于作者：泓</span><span class="author-arrow" aria-hidden="true">›</span>
</a>
  <span class="social-divider" aria-hidden="true"></span>
  <a class="author-link telegram-link" href="https://t.me/April823" target="_blank" rel="noopener noreferrer" aria-label="打开 Telegram：April823">
    <span class="telegram-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M21.4 4.6 18.2 20c-.24 1.08-.87 1.35-1.76.84l-4.88-3.6-2.35 2.26c-.26.26-.48.48-.98.48l.35-4.97 9.05-8.18c.39-.35-.09-.55-.6-.2L5.85 13.7 1.1 12.2c-1.03-.32-1.05-1.03.22-1.53L19.9 3.5c.86-.32 1.61.21 1.5 1.1Z" fill="white"/></svg>
    </span>
    <span>Telegram</span><span class="author-arrow" aria-hidden="true">›</span>
  </a>
</div>

<div class="memory-modal" id="memoryModal" role="dialog" aria-modal="true" aria-label="10月3日照片">
  <div class="memory-card">
    <div class="memory-head"><span>10月3日 · 记忆</span><button class="memory-close" id="memoryClose" type="button" aria-label="关闭">×</button></div>
    <div class="memory-photos">
      <img src="assets/images/image-2.jpg" alt="雨后地面上的纸屑">
      <img src="assets/images/image-3.jpg" alt="用纸张折成的花束">
    </div>
    <audio class="memory-audio" id="memoryAudio" controls loop preload="auto" src="assets/music/music.mp3"></audio>
  </div>
</div>

<!-- 本地数据：农历库、法定节假日。装到桌面后断网也能用。 -->
<script src="assets/js/chinese-days.js" defer></script>
<script src="assets/js/app.js" defer></script>
<script>
/* 注册 Service Worker：满足 PWA 可安装条件，并让页面离线可用 */
(function () {
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
})();
</script>
</body>
</html>
