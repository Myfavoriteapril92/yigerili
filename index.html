<style>
/* ---------- 基础 ---------- */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { height: 100%; }
body {
  min-height: 100%;
  padding: 10px 12px 18px;
  padding-bottom: calc(18px + env(safe-area-inset-bottom));
  background: linear-gradient(160deg, #eef2ff 0%, #f8fafc 45%, #eef7ff 100%);
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  color: #1e293b;
  -webkit-text-size-adjust: 100%;
  -webkit-touch-callout: none;
  overflow-x: hidden;
}

/* ---------- 卡片 ---------- */
.calendar {
  width: 100%; max-width: 480px; margin: 0 auto;
  background: #fff; border-radius: 18px; padding: 14px;
  box-shadow: 0 12px 30px rgba(15, 23, 42, .08);
}

/* ---------- 顶部 ---------- */
.top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.app-name { font-size: 12px; font-weight: 700; color: #94a3b8; margin-left: 5px; }
.music-btn {
  border: none; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600;
  padding: 6px 12px; border-radius: 10px; background: #f1f5f9; color: #475569;
}
.music-btn.playing { background: #e6f7ff; color: #096dd9; }

/* ---------- 月份头 ---------- */
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.title-area { display: flex; flex-direction: column; align-items: center; }
#monthTitle { font-size: 19px; font-weight: 700; color: #1e293b; }
#lunarYearText { font-size: 11px; color: #94a3b8; min-height: 14px; line-height: 14px; }
.nav-btn {
  width: 36px; height: 36px; border: none; background: #f1f5f9; color: #334155;
  cursor: pointer; border-radius: 10px; font-size: 20px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  -webkit-appearance: none; appearance: none;
}
.nav-btn:active { background: #e2e8f0; }
.today-btn {
  margin-top: 3px; padding: 3px 10px; font-size: 11px; font-weight: 600; border: none;
  background: #f1f5f9; color: #475569; border-radius: 8px; cursor: pointer; font-family: inherit;
}
.today-btn:active { background: #e2e8f0; }

/* ---------- 星期 / 日期网格 ---------- */
.weekdays { display: flex; text-align: center; color: #94a3b8; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
.weekdays > div { width: 14.28%; padding: 4px 0; }
.weekdays .we { color: #e07a5f; }

.days { display: flex; flex-wrap: wrap; margin: 0 -2px; }
.day { width: 14.28%; height: 50px; padding: 4px; }
.di {
  position: relative; width: 100%; height: 100%; border-radius: 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  -webkit-user-select: none; user-select: none; overflow: hidden;
}
.day:active .di { background: #f1f5f9; }
.num { font-size: 14px; color: #334155; line-height: 1.2; }
.lunar {
  font-size: 9px; color: #94a3b8; line-height: 1.25; max-width: 100%;
  padding: 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.day.other .num, .day.other .lunar { opacity: .35; }
.day.today .di { border: 2px solid #4a90e2; }
.day.today .num { color: #4a90e2; font-weight: 700; }
.day.sel .di { background: #4a90e2; box-shadow: 0 5px 14px rgba(74, 144, 226, .35); }
.day.sel .di { border: none; }
.day.sel .num, .day.sel .lunar { color: #fff !important; opacity: 1; }
.day.fest .lunar { color: #e07a5f; font-weight: 600; }
.day.sel.fest .lunar { color: #ffe0d0 !important; }

/* 节假日改用轻量圆点提示，不再显示红色角标 */
.holiday-dot {
  position: absolute;
  right: 5px;
  bottom: 5px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #f07878;
  box-shadow: 0 0 0 2px rgba(240, 120, 120, .12);
}
.holiday-dot.work { background: #94a3b8; box-shadow: 0 0 0 2px rgba(148, 163, 184, .13); }
.day.sel .holiday-dot { background: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.2); }
.dot { position: absolute; bottom: 3px; right: 4px; width: 4px; height: 4px; border-radius: 50%; background: #cbd5e1; }
.dot.active { background: #4a90e2; }
.day.sel .dot { background: #fff; }

/* ---------- 详情面板 ---------- */
.panel { margin-top: 12px; background: #f8fafc; border-radius: 14px; padding: 12px 14px; border: 1px solid #e2e8f0; }
.date-line { font-size: 15px; font-weight: 700; color: #1e293b; margin-bottom: 3px; }
.lunar-line { font-size: 12px; color: #64748b; margin-bottom: 8px; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
.tag { font-size: 10px; padding: 3px 7px; border-radius: 7px; font-weight: 600; }
.tag.holiday { background: #fff1f0; color: #cf1322; border: 1px solid #ffa39e; }
.tag.fest { background: #fff7e6; color: #d46b08; border: 1px solid #ffd591; }
.tag.jq { background: #e6f7ff; color: #096dd9; border: 1px solid #91d5ff; }
.tag.normal { background: #f0f0f0; color: #595959; border: 1px solid #d9d9d9; }
.gz { font-size: 11px; color: #94a3b8; line-height: 1.7; }
.gz span { margin-right: 10px; }

/* ---------- 待办 ---------- */
.todo-sec { margin-top: 12px; padding-top: 10px; border-top: 1px dashed #e2e8f0; }
.todo-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.todo-title { font-size: 12px; font-weight: 700; color: #334155; }
.todo-count { font-size: 10px; color: #94a3b8; background: #f1f5f9; padding: 2px 7px; border-radius: 7px; }
.todo-empty { font-size: 11px; color: #cbd5e1; text-align: center; padding: 8px 0; }
.todo-item {
  display: flex; align-items: center; gap: 7px; padding: 6px 8px; border-radius: 8px;
  background: #fff; border: 1px solid #e2e8f0; margin-bottom: 5px;
}
.check {
  width: 15px; height: 15px; flex: 0 0 15px; border-radius: 50%; border: 1.5px solid #cbd5e1;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; color: #fff; line-height: 1;
}
.todo-item.done .check { background: #4a90e2; border-color: #4a90e2; }
.txt { flex: 1; font-size: 12px; color: #334155; word-break: break-all; line-height: 1.4; cursor: pointer; }
.todo-item.done .txt { color: #cbd5e1; text-decoration: line-through; }
.del { font-size: 15px; color: #cbd5e1; padding: 0 3px; line-height: 1; }
.input-row { display: flex; gap: 6px; margin-top: 6px; }
#todoInput {
  flex: 1; border: 1px solid #e2e8f0; border-radius: 9px; padding: 7px 11px;
  font-size: 12px; font-family: inherit; outline: none; background: #fff;
  color: #334155; min-width: 0; -webkit-user-select: auto; user-select: auto;
  -webkit-appearance: none; appearance: none;
}
#todoInput:focus { border-color: #4a90e2; box-shadow: 0 0 0 3px rgba(74, 144, 226, .12); }
#todoAdd {
  border: none; background: #4a90e2; color: #fff; font-size: 12px; font-weight: 600;
  padding: 0 14px; border-radius: 9px; cursor: pointer; font-family: inherit;
}
#todoAdd:active { background: #3b7dd8; }

:root { --accent:#007aff; --ink:#1d1d1f; --muted:#86868b; }
html { background:#f5f5f7; }
body { padding:18px 14px calc(24px + env(safe-area-inset-bottom)); background:radial-gradient(ellipse at 10% 0%,rgba(0,122,255,.09),transparent 42%),linear-gradient(180deg,#f5f5f7,#eef1f6); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Helvetica Neue",sans-serif; letter-spacing:-.2px; }

#lunarYearText { color:#86868b; }

/* Gentle iOS-style entrance and touch feedback */
@keyframes cardAppear { from{opacity:0;transform:translateY(12px) scale(.985);filter:blur(3px)} to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)} }
@keyframes contentReveal { from{opacity:0;transform:translateY(7px)} to{opacity:1;transform:translateY(0)} }
@keyframes dayPop { from{opacity:0;transform:translateY(5px) scale(.94)} to{opacity:1;transform:translateY(0) scale(1)} }
@keyframes selectedPulse { 0%{box-shadow:0 0 0 0 rgba(0,122,255,.25)} 65%{box-shadow:0 0 0 5px rgba(0,122,255,0)} 100%{box-shadow:0 5px 12px rgba(0,122,255,.24)} }
.calendar { animation:cardAppear .55s cubic-bezier(.2,.75,.25,1) both; }
.days.motion-in .day { animation:dayPop .32s cubic-bezier(.2,.75,.25,1) both; }
.days.motion-in .day:nth-child(7n+1){animation-delay:.015s}.days.motion-in .day:nth-child(7n+2){animation-delay:.03s}.days.motion-in .day:nth-child(7n+3){animation-delay:.045s}.days.motion-in .day:nth-child(7n+4){animation-delay:.06s}.days.motion-in .day:nth-child(7n+5){animation-delay:.075s}.days.motion-in .day:nth-child(7n+6){animation-delay:.09s}.days.motion-in .day:nth-child(7n){animation-delay:.105s}
.panel { animation:contentReveal .28s ease-out both; }
.day.sel .di { animation:selectedPulse .42s ease-out; }
.day:active .di,.music-btn:active,.nav-btn:active,.today-btn:active { transform:scale(.94); }
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* 10月3日纪念弹窗：柔和的 iOS 毛玻璃风格 */
.memory-modal{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(22,32,52,.34);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

    <div class="memory-head"><span>10月3日 · 记忆</span><button class="memory-close" id="memoryClose" type="button" aria-label="关闭">×</button></div>

      <img src="assets/images/image-2.jpg" alt="雨后地面上的纸屑">

  </div>

<script>
/* =========================================================================
 *  加载农历库：优先使用同目录下的 lunar.js（打包进 assets 即可离线），
 *  没有则回退到 CDN；两者都失败时仍可正常使用公历功能。
 * ========================================================================= */
(function () {
  function boot() {
    if (window.__APP_STARTED__) return;
    window.__APP_STARTED__ = true;
    startApp();
  }
  function load(src, onFail) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = boot;
    s.onerror = function () { if (onFail) onFail(); else boot(); };
    document.head.appendChild(s);
  }
  load('lunar.js', function () {
    load('https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js');
  });
})();

/* =========================================================================
 *  主程序（全部使用 ES5 语法，兼容低版本 Android WebView）
 * ========================================================================= */
function startApp() {
  var $ = function (id) { return document.getElementById(id); };
  var WEEK = ['日', '一', '二', '三', '四', '五', '六'];
  var pad2 = function (n) { return n < 10 ? '0' + n : '' + n; };

  var today = new Date();
  var viewYear = today.getFullYear();
  var viewMonth = today.getMonth();
  var selected = new Date(viewYear, viewMonth, today.getDate());
  var selectedKey = '';

  var daysBox = $('days');
  var panel = $('panel');

  /* ---------------- 工具 ---------------- */

  function todayDate() {
    var d = new Date();
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }

  function keyOf(y, m, d) { return y + '-' + pad2(m + 1) + '-' + pad2(d); }

  function sameDay(a, b) {
    return a.getFullYear() === b.getFullYear() &&
           a.getMonth() === b.getMonth() &&
           a.getDate() === b.getDate();
  }

  function closest(el, cls, stop) {
    while (el && el !== stop && el !== document) {
      if (el.className && typeof el.className === 'string' &&
          (' ' + el.className + ' ').indexOf(' ' + cls + ' ') >= 0) return el;
      el = el.parentNode;
    }
    return null;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* 待办功能已移除。 */

  /* ---------------- 法定节假日（联网获取，失败不影响使用） ---------------- */

  var holidays = {};

  function cleanName(name) {
    if (typeof name !== 'string' || name.indexOf(',') < 0) return name;
    var parts = name.split(',');
    for (var i = 0; i < parts.length; i++) {
      if (/[\u4e00-\u9fa5]/.test(parts[i]) && !/^[0-9]+$/.test(parts[i])) return parts[i];
    }
    return parts[0];
  }

  function loadHolidays() {
    try {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'https://cdn.jsdelivr.net/npm/chinese-days/dist/chinese-days.json', true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) return;
        if (xhr.status !== 200 && xhr.status !== 0) return;
        try {
          var data = JSON.parse(xhr.responseText);
          var d;
          for (d in data.holidays) {
            if (data.holidays.hasOwnProperty(d)) holidays[d] = { name: cleanName(data.holidays[d]), work: false };
          }
          for (d in data.workdays) {
            if (data.workdays.hasOwnProperty(d)) holidays[d] = { name: cleanName(data.workdays[d]), work: true };
          }
          render();
        } catch (e) {}
      };
      xhr.send();
    } catch (e) {}
  }

  /* ---------------- 农历信息 ---------------- */

  function lunarOf(date) {
    if (typeof Solar === 'undefined' || !Solar || !Solar.fromDate) return null;
    try { return Solar.fromDate(date).getLunar(); } catch (e) { return null; }
  }

  function getInfo(date) {
    var k = keyOf(date.getFullYear(), date.getMonth(), date.getDate());
    var info = { lunar: null, lunarText: '', jq: '', fests: [], holiday: holidays[k] || null };
    var lunar = lunarOf(date);
    if (!lunar) return info;
    try {
      var solar = Solar.fromDate(date);
      info.lunar = lunar;
      var dn = lunar.getDayInChinese();
      info.lunarText = (dn === '初一') ? (lunar.getMonthInChinese() + '月') : dn;
      info.jq = lunar.getJieQi() || '';
      var sf = solar.getFestivals() || [];
      var lf = lunar.getFestivals() || [];
      var all = [], i;
      for (i = 0; i < sf.length; i++) all.push(sf[i]);
      for (i = 0; i < lf.length; i++) all.push(lf[i]);
      var uniq = [];
      for (i = 0; i < all.length; i++) {
        if (uniq.indexOf(all[i]) < 0) uniq.push(all[i]);
      }
      info.fests = uniq;
    } catch (e) {}
    return info;
  }

  function shortest(arr) {
    var s = arr[0];
    for (var i = 1; i < arr.length; i++) { if (arr[i].length < s.length) s = arr[i]; }
    return s;
  }

  /* ---------------- 渲染 ---------------- */

  function render() {
    today = todayDate();

    $('monthTitle').innerHTML = viewYear + '年' + (viewMonth + 1) + '月';

    var ml = lunarOf(new Date(viewYear, viewMonth, 1));
    $('lunarYearText').innerHTML = ml
      ? (ml.getYearInGanZhi() + '年 · 属' + ml.getYearShengXiao())
      : '';

    var startWeek = new Date(viewYear, viewMonth, 1).getDay();
    var daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    var daysInPrev = new Date(viewYear, viewMonth, 0).getDate();
    var html = '', i, date, other;

    for (i = 0; i < 42; i++) {
      other = false;
      if (i < startWeek) {
        date = new Date(viewYear, viewMonth - 1, daysInPrev - startWeek + 1 + i);
        other = true;
      } else if (i >= startWeek + daysInMonth) {
        date = new Date(viewYear, viewMonth + 1, i - startWeek - daysInMonth + 1);
        other = true;
      } else {
        date = new Date(viewYear, viewMonth, i - startWeek + 1);
      }
      html += dayHtml(date, other);
    }

    daysBox.className = 'days';
    daysBox.innerHTML = html;
    void daysBox.offsetWidth;
    daysBox.className = 'days motion-in';
    renderPanel(selected);
  }

  function dayHtml(date, other) {
    var info = getInfo(date);
    var k = keyOf(date.getFullYear(), date.getMonth(), date.getDate());
    var cls = 'day';
    if (other) cls += ' other';
    if (sameDay(date, today)) cls += ' today';
    if (sameDay(date, selected)) cls += ' sel';
    if (info.fests.length) cls += ' fest';

    var label = info.fests.length ? shortest(info.fests) : info.lunarText;
    if (!label) label = '&nbsp;';

    var inner = '<div class="di">' +
        '<span class="num">' + date.getDate() + '</span>' +
        '<span class="lunar">' + label + '</span>';

    if (info.holiday) {
      inner += '<span class="holiday-dot ' + (info.holiday.work ? 'work' : 'rest') + '" aria-label="' +
               (info.holiday.work ? '调休上班' : '节假日') + '"></span>';
    }



    inner += '</div>';

    return '<div class="' + cls + '" data-k="' + k + '"' +
           ' data-y="' + date.getFullYear() + '"' +
           ' data-m="' + date.getMonth() + '"' +
           ' data-d="' + date.getDate() + '">' + inner + '</div>';
  }

  function renderPanel(date) {
    var info = getInfo(date);
    var k = keyOf(date.getFullYear(), date.getMonth(), date.getDate());
    selectedKey = k;

    var html = '<div class="date-line">' +
      date.getFullYear() + '年' + pad2(date.getMonth() + 1) + '月' + pad2(date.getDate()) +
      '日 星期' + WEEK[date.getDay()] + '</div>';

    if (info.lunar) {
      html += '<div class="lunar-line">农历' + info.lunar.getYearInChinese() + '年' +
              info.lunar.getMonthInChinese() + '月' + info.lunar.getDayInChinese() + '</div>';
    } else {
      html += '<div class="lunar-line">农历数据需联网加载，当前显示公历</div>';
    }

    var tags = '', i;
    if (info.holiday) {
      tags += '<span class="tag ' + (info.holiday.work ? 'normal' : 'holiday') + '">' +
              esc(info.holiday.name) + (info.holiday.work ? ' · 上班' : ' · 放假') + '</span>';
    }
    for (i = 0; i < info.fests.length; i++) {
      var f = info.fests[i];
      if (info.holiday && f === info.holiday.name) continue;
      tags += '<span class="tag ' + (f === info.jq ? 'jq' : 'fest') + '">' + esc(f) + '</span>';
    }
    if (!tags) tags = '<span class="tag normal">普通日子</span>';
    html += '<div class="tags">' + tags + '</div>';

    if (info.lunar) {
      html += '<div class="gz"><span>' + info.lunar.getYearInGanZhi() + '年 ' +
              info.lunar.getMonthInGanZhi() + '月 ' + info.lunar.getDayInGanZhi() + '日</span>' +
              '<span>属' + info.lunar.getYearShengXiao() + '</span></div>';
    }

    panel.innerHTML = html;
  }

  /* ---------------- 交互 ---------------- */

  function shiftMonth(delta) {
    var d = new Date(viewYear, viewMonth + delta, 1);
    viewYear = d.getFullYear();
    viewMonth = d.getMonth();
    render();
  }

  $('prevBtn').onclick = function () { shiftMonth(-1); };
  $('nextBtn').onclick = function () { shiftMonth(1); };
  $('todayBtn').onclick = function () {
    var t = new Date();
    viewYear = t.getFullYear();
    viewMonth = t.getMonth();
    selected = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    render();
  };

  daysBox.onclick = function (e) {
    var el = closest(e.target, 'day', daysBox);
    if (!el) return;
    var y = parseInt(el.getAttribute('data-y'), 10);
    var m = parseInt(el.getAttribute('data-m'), 10);
    var d = parseInt(el.getAttribute('data-d'), 10);
    selected = new Date(y, m, d);
    if (m !== viewMonth || y !== viewYear) { viewYear = y; viewMonth = m; }
    render();
    if (y === 2026 && m === 9 && d === 3) openMemoryModal();
  };

  /* ---------------- 背景音乐：许嵩《玫瑰花的葬礼》 ---------------- */
  var music = $('memoryAudio');
  var modal = $('memoryModal');

  function startMusic() {
    if (!music) return;
    music.play().catch(function () {});
  }

  function openMemoryModal() {
    if (!modal) return;
    modal.classList.add('show');
    document.body.style.overflow = 'hidden';
    startMusic();
  }

  function closeMemoryModal() {
    if (!modal) return;
    modal.classList.remove('show');
    document.body.style.overflow = '';
  }

  $('memoryClose').onclick = closeMemoryModal;
  modal.addEventListener('click', function(e) { if (e.target === modal) closeMemoryModal(); });
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeMemoryModal(); });


  /* ---------------- 启动 ---------------- */

  render();
  loadHolidays();
}
</script>
</body>
