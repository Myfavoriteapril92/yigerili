name: 构建安卓 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'assets/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/main.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    # ubuntu-latest 已切到 26.04，setup-android 在上面无法接受 SDK 许可证
    runs-on: ubuntu-22.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: 准备 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 网页侧自检（农历 / 节假日 / 渲染）
        run: node tools/smoke-test.js

      - name: 构建 debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 整理产物文件名
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/易个日历-debug.apk"
          ls -lh dist

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: yigerili-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: 打 tag 时发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
